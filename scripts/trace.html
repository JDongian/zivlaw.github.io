<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Logo tracer</title>
<style>
  body { margin: 0; padding: 16px; font: 14px system-ui, sans-serif; background: #eee; }
  canvas { display: block; width: min(600px, 100%); aspect-ratio: 1; background: #fff;
           touch-action: none; border: 1px solid #ccc; margin-top: 12px; }
  .bar { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
  textarea { width: min(600px, 100%); height: 80px; margin-top: 12px; font: 11px monospace; }
</style>
</head>
<body>
<div class="bar">
  <button id="undo">Undo</button>
  <button id="clear">Clear</button>
  <button id="play">Replay</button>
  <button id="export">Export</button>
  <label>Brush <input id="brush" type="range" min="4" max="30" value="12"></label>
</div>
<canvas id="c" width="1200" height="1200"></canvas>
<textarea id="out" placeholder="Exported JSON appears here (also copied to clipboard)"></textarea>
<script>
// Trace the logo in writing order. Points are stored in logo pixels (0-200).
// Only the path matters: replay runs at a constant speed regardless of how fast you traced.
const SIZE = 200, canvas = document.getElementById("c"), ctx = canvas.getContext("2d");
const scale = canvas.width / SIZE;
const brush = document.getElementById("brush");
const logo = new Image();
logo.src = "../logo.jpg";
logo.onload = draw;

let strokes = [], current = null, playing = false;

function toLogo(e) {
  const r = canvas.getBoundingClientRect();
  return [+((e.clientX - r.left) / r.width * SIZE).toFixed(1),
          +((e.clientY - r.top) / r.height * SIZE).toFixed(1)];
}

canvas.onpointerdown = e => {
  if (playing) return;
  canvas.setPointerCapture(e.pointerId);
  current = [toLogo(e)];
  strokes.push(current);
  draw();
};
canvas.onpointermove = e => {
  if (!current) return;
  current.push(toLogo(e));
  draw();
};
canvas.onpointerup = canvas.onpointercancel = () => { current = null; };

function path(c, pts) {
  c.beginPath();
  pts.forEach(([x, y], i) => i ? c.lineTo(x * scale, y * scale) : c.moveTo(x * scale, y * scale));
  if (pts.length === 1) c.lineTo(pts[0][0] * scale + 0.1, pts[0][1] * scale);
  c.stroke();
}

function setPen(c, style) {
  c.lineWidth = brush.value * scale;
  c.lineCap = c.lineJoin = "round";
  c.strokeStyle = style;
}

// Tracing view: faded logo with your strokes on top.
function draw() {
  ctx.clearRect(0, 0, canvas.width, canvas.height);
  ctx.globalAlpha = 0.35;
  ctx.drawImage(logo, 0, 0, canvas.width, canvas.height);
  ctx.globalAlpha = 1;
  setPen(ctx, "rgba(220, 40, 40, 0.45)");
  strokes.forEach(s => path(ctx, s));
}

// Replay: strokes act as a mask that reveals the real logo, drawn at a
// constant pen speed with a short pause between strokes.
const SPEED = 400, GAP = 60; // logo px per second, ms per pen lift

function lengths(pts) {
  const acc = [0];
  for (let i = 1; i < pts.length; i++)
    acc.push(acc[i - 1] + Math.hypot(pts[i][0] - pts[i - 1][0], pts[i][1] - pts[i - 1][1]));
  return acc;
}

// The first `dist` units of a stroke, ending on an interpolated point.
function partial(pts, acc, dist) {
  if (dist >= acc.at(-1)) return pts;
  let i = 1;
  while (acc[i] < dist) i++;
  const f = (dist - acc[i - 1]) / (acc[i] - acc[i - 1] || 1);
  const [x0, y0] = pts[i - 1], [x1, y1] = pts[i];
  return [...pts.slice(0, i), [x0 + (x1 - x0) * f, y0 + (y1 - y0) * f]];
}

function play() {
  if (!strokes.length || playing) return;
  playing = true;
  const mask = Object.assign(document.createElement("canvas"), { width: canvas.width, height: canvas.height });
  const m = mask.getContext("2d");
  const accs = strokes.map(lengths);
  // Pen lifts count as distance so they take GAP ms at constant speed.
  const gapDist = SPEED * GAP / 1000;
  const total = accs.reduce((sum, a) => sum + a.at(-1), 0) + gapDist * (strokes.length - 1);
  const duration = total / SPEED * 1000, start = performance.now();
  (function frame(now) {
    const p = Math.min((now - start) / duration, 1);
    let left = p * total;
    m.globalCompositeOperation = "source-over";
    m.clearRect(0, 0, mask.width, mask.height);
    setPen(m, "#000");
    for (let i = 0; i < strokes.length && left > 0; i++) {
      path(m, partial(strokes[i], accs[i], left));
      left -= accs[i].at(-1) + gapDist;
    }
    m.globalCompositeOperation = "source-in";
    m.drawImage(logo, 0, 0, mask.width, mask.height);
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    ctx.drawImage(mask, 0, 0);
    if (p < 1) requestAnimationFrame(frame);
    else setTimeout(() => { playing = false; draw(); }, 800);
  })(start);
}

document.getElementById("undo").onclick = () => { strokes.pop(); draw(); };
document.getElementById("clear").onclick = () => { strokes = []; draw(); };
document.getElementById("play").onclick = play;
brush.oninput = draw;
document.getElementById("export").onclick = () => {
  const json = JSON.stringify({ size: SIZE, brush: +brush.value, strokes });
  document.getElementById("out").value = json;
  navigator.clipboard?.writeText(json).catch(() => {});
};
</script>
</body>
</html>
